# 测试环境配置
spring:
  # 数据库配置 - 使用MySQL测试数据库
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://your-db-host.example.com:45266/chat_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: hgjnjzpz

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
      
  # 日志配置
  logging:
    level:
      com.instser.chat: DEBUG
      org.springframework.security: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
      
  # 安全配置
  security:
    user:
      name: testuser
      password: testpass
      roles: USER

# 测试专用配置
test:
  # 禁用外部服务调用
  external-services:
    enabled: false
    
  # AI服务模拟配置
  ai-service:
    mock-enabled: true
    mock-response: "This is a mock AI response for testing"
    
  # 支付服务模拟配置
  payment-service:
    mock-enabled: true
