# 测试环境配置
spring:
  # 数据库配置 - 使用H2内存数据库
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        
  # H2控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console
      
  # 日志配置
  logging:
    level:
      com.instser.chat: DEBUG
      org.springframework.security: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
      
  # 安全配置
  security:
    user:
      name: testuser
      password: testpass
      roles: USER

# 测试专用配置
test:
  # 禁用外部服务调用
  external-services:
    enabled: false
    
  # AI服务模拟配置
  ai-service:
    mock-enabled: true
    mock-response: "This is a mock AI response for testing"
    
  # 支付服务模拟配置
  payment-service:
    mock-enabled: true
