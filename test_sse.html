<!DOCTYPE html>
<html>
<head>
    <title>SSE流式响应测试</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>SSE流式响应测试</h1>
    
    <div>
        <h3>1. 登录测试</h3>
        <button onclick="login()">登录</button>
        <div id="loginResult"></div>
    </div>
    
    <div>
        <h3>2. SSE流式聊天测试</h3>
        <button onclick="testSSE()">测试SSE流式响应</button>
        <div id="sseResult"></div>
    </div>
    
    <div>
        <h3>3. 未认证SSE测试</h3>
        <button onclick="testSSEWithoutAuth()">测试未认证SSE</button>
        <div id="sseNoAuthResult"></div>
    </div>

    <script>
        async function login() {
            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        usernameOrEmail: 'admin@example.com',
                        password: '123456'
                    })
                });
                
                const result = await response.json();
                document.getElementById('loginResult').innerHTML = 
                    '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                    
                if (result.code === 200) {
                    alert('登录成功！');
                }
            } catch (error) {
                document.getElementById('loginResult').innerHTML = 
                    '<div style="color: red;">登录失败: ' + error.message + '</div>';
            }
        }
        
        function testSSE() {
            const resultDiv = document.getElementById('sseResult');
            resultDiv.innerHTML = '<div>开始SSE测试...</div>';

            // 添加调试信息
            resultDiv.innerHTML += '<div style="color: blue;">请求URL: http://localhost:8080/api/sse/chat</div>';

            fetch('http://localhost:8080/api/sse/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'text/event-stream'
                },
                credentials: 'include',
                body: JSON.stringify({
                    messages: [
                        {role: 'user', content: '测试新的SSE控制器'}
                    ],
                    userId: 1931350026773823490
                })
            }).then(response => {
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                function readStream() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            resultDiv.innerHTML += '<div style="color: green;">SSE流结束</div>';
                            return;
                        }
                        
                        const chunk = decoder.decode(value, { stream: true });
                        resultDiv.innerHTML += '<div>收到数据: ' + chunk + '</div>';
                        
                        readStream();
                    }).catch(error => {
                        resultDiv.innerHTML += '<div style="color: red;">读取错误: ' + error.message + '</div>';
                    });
                }
                
                readStream();
            }).catch(error => {
                resultDiv.innerHTML += '<div style="color: red;">请求错误: ' + error.message + '</div>';
            });
        }
        
        function testSSEWithoutAuth() {
            const resultDiv = document.getElementById('sseNoAuthResult');
            resultDiv.innerHTML = '<div>开始未认证SSE测试...</div>';

            fetch('http://localhost:8080/api/sse/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'text/event-stream'
                },
                body: JSON.stringify({
                    messages: [
                        {role: 'user', content: '测试'}
                    ],
                    userId: 1
                })
            }).then(response => {
                resultDiv.innerHTML += '<div>响应状态: ' + response.status + '</div>';
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                function readStream() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            resultDiv.innerHTML += '<div style="color: green;">SSE流结束</div>';
                            return;
                        }
                        
                        const chunk = decoder.decode(value, { stream: true });
                        resultDiv.innerHTML += '<div>收到数据: ' + chunk + '</div>';
                        
                        readStream();
                    }).catch(error => {
                        resultDiv.innerHTML += '<div style="color: red;">读取错误: ' + error.message + '</div>';
                    });
                }
                
                readStream();
            }).catch(error => {
                resultDiv.innerHTML += '<div style="color: red;">请求错误: ' + error.message + '</div>';
            });
        }
    </script>
</body>
</html>
